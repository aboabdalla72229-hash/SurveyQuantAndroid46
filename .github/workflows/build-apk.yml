name: Build SurveyQuant v1.0.46 From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -name "SurveyQuantAndroid_v1.0.46_ALL_REQUESTED_FIXES.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP FILE NOT FOUND"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "=== EXTRACTED FILES ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android Project
        run: |
          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew NOT FOUND"
            echo "Searching Gradle files..."
            find extracted -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.46-APK
          path: ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
