name: Build SurveyQuant v1.0.46 From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP File
        id: find_zip
        shell: bash
        run: |
          echo "Searching for SurveyQuant ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "SurveyQuantAndroid_v1.0.46_ALL_REQUESTED_FIXES.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted_project

          echo "ZIP extracted successfully."

          echo "=== Extracted structure ==="
          find extracted_project -maxdepth 5 -print | sort

      - name: Detect Android Project
        id: detect_project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          GRADLEW=$(find extracted_project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo ""
            echo "Searching for Gradle files:"
            find extracted_project -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x gradlew

          echo "=== Project files ==="
          ls -la

      - name: Build APK
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find Generated APK
        id: find_apk
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find "${{ steps.detect_project.outputs.project_dir }}" \
            -type f -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.46-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
